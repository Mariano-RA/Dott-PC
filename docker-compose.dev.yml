services:
  dottpc-rabbit:
    container_name: dottpc-rabbit
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rabbitnetwork

  mysql:
    image: mysql:8.0
    container_name: mysql-database
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rabbitnetwork

  backend:
    build:
      context: ./back
      dockerfile: ./Dockerfile
      target: deps
    container_name: dott-back
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - ISSUER_BASE_URL=${ISSUER_BASE_URL}
      - AUDIENCE=${AUDIENCE}
      - CLIENT_ORIGIN_URL=${CLIENT_ORIGIN_URL}
      - ENABLE_HTTPS=${ENABLE_HTTPS}
      - HTTPS_KEY_PATH=${HTTPS_KEY_PATH}
      - HTTPS_CERT_PATH=${HTTPS_CERT_PATH}
      - JWT_AT_SECRET=${JWT_AT_SECRET}
      - JWT_RT_SECRET=${JWT_RT_SECRET}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SYNC=${DB_SYNC}
      - LOCAL_DEV_AUTH_BYPASS=${LOCAL_DEV_AUTH_BYPASS}
      - RABBITMQ_QUEUE=${RABBITMQ_QUEUE}
      - RABBITMQ_PYTHON_QUEUE=${RABBITMQ_PYTHON_QUEUE}
      - RABBITMQ_FETCH_PRICES_QUEUE=${RABBITMQ_FETCH_PRICES_QUEUE:-fetch_prices}
      - RABBIT_MQ_URI=amqp://dottpc-rabbit:5672
    command: ["sh", "-c", "npm ci || npm install; npm run start:dev"]
    volumes:
      - ./back:/app
      - back_node_modules:/app/node_modules
    depends_on:
      dottpc-rabbit:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - rabbitnetwork

  python-api:
    build:
      context: ./python-api
      dockerfile: ./Dockerfile
    container_name: dott-python
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5000:5000"
    environment:
      - RABBITMQ_QUEUE=${RABBITMQ_QUEUE}
      - RABBITMQ_PYTHON_QUEUE=${RABBITMQ_PYTHON_QUEUE}
      - RABBITMQ_FETCH_PRICES_QUEUE=${RABBITMQ_FETCH_PRICES_QUEUE:-fetch_prices}
      - RABBITMQ_RETRY_DELAY=${RABBITMQ_RETRY_DELAY}
      - RABBITMQ_URL=dottpc-rabbit
      - SUPPLIER_AIR_URL=${SUPPLIER_AIR_URL:-}
      - SUPPLIER_AIR_USER=${SUPPLIER_AIR_USER:-}
      - SUPPLIER_AIR_PASSWORD=${SUPPLIER_AIR_PASSWORD:-}
      - SUPPLIER_ELIT_URL=${SUPPLIER_ELIT_URL:-}
      - SUPPLIER_ELIT_USER_ID=${SUPPLIER_ELIT_USER_ID:-}
      - SUPPLIER_ELIT_TOKEN=${SUPPLIER_ELIT_TOKEN:-}
      - SUPPLIER_HDC_URL=${SUPPLIER_HDC_URL:-}
      - SUPPLIER_HDC_USER=${SUPPLIER_HDC_USER:-}
      - SUPPLIER_HDC_PASSWORD=${SUPPLIER_HDC_PASSWORD:-}
      - SUPPLIER_INVID_URL=${SUPPLIER_INVID_URL:-}
      - SUPPLIER_INVID_USER=${SUPPLIER_INVID_USER:-}
      - SUPPLIER_INVID_PASSWORD=${SUPPLIER_INVID_PASSWORD:-}
      - SUPPLIER_NB_URL=${SUPPLIER_NB_URL:-}
      - SUPPLIER_NB_API_KEY=${SUPPLIER_NB_API_KEY:-}
      - SUPPLIER_NB_TOKEN=${SUPPLIER_NB_TOKEN:-}
      - SUPPLIER_MEGA_URL=${SUPPLIER_MEGA_URL:-}
      - SUPPLIER_MEGA_USER=${SUPPLIER_MEGA_USER:-}
      - SUPPLIER_MEGA_PASSWORD=${SUPPLIER_MEGA_PASSWORD:-}
    command: ["sh", "-c", "pip install -q -r requirements.txt && python dottDB.py"]
    volumes:
      - ./python-api:/app
    depends_on:
      dottpc-rabbit:
        condition: service_healthy
    networks:
      - rabbitnetwork

  python-api-fetch:
    build:
      context: ./python-api
      dockerfile: ./Dockerfile
    container_name: dott-python-fetch
    restart: unless-stopped
    working_dir: /app
    environment:
      - RABBITMQ_QUEUE=${RABBITMQ_QUEUE}
      - RABBITMQ_PYTHON_QUEUE=${RABBITMQ_PYTHON_QUEUE}
      - RABBITMQ_FETCH_PRICES_QUEUE=${RABBITMQ_FETCH_PRICES_QUEUE:-fetch_prices}
      - RABBITMQ_RETRY_DELAY=${RABBITMQ_RETRY_DELAY}
      - RABBITMQ_URL=dottpc-rabbit
      - SUPPLIER_AIR_URL=${SUPPLIER_AIR_URL:-}
      - SUPPLIER_AIR_USER=${SUPPLIER_AIR_USER:-}
      - SUPPLIER_AIR_PASSWORD=${SUPPLIER_AIR_PASSWORD:-}
      - SUPPLIER_ELIT_URL=${SUPPLIER_ELIT_URL:-}
      - SUPPLIER_ELIT_USER_ID=${SUPPLIER_ELIT_USER_ID:-}
      - SUPPLIER_ELIT_TOKEN=${SUPPLIER_ELIT_TOKEN:-}
      - SUPPLIER_HDC_URL=${SUPPLIER_HDC_URL:-}
      - SUPPLIER_HDC_USER=${SUPPLIER_HDC_USER:-}
      - SUPPLIER_HDC_PASSWORD=${SUPPLIER_HDC_PASSWORD:-}
      - SUPPLIER_INVID_URL=${SUPPLIER_INVID_URL:-}
      - SUPPLIER_INVID_USER=${SUPPLIER_INVID_USER:-}
      - SUPPLIER_INVID_PASSWORD=${SUPPLIER_INVID_PASSWORD:-}
      - SUPPLIER_NB_URL=${SUPPLIER_NB_URL:-}
      - SUPPLIER_NB_API_KEY=${SUPPLIER_NB_API_KEY:-}
      - SUPPLIER_NB_TOKEN=${SUPPLIER_NB_TOKEN:-}
      - SUPPLIER_MEGA_URL=${SUPPLIER_MEGA_URL:-}
      - SUPPLIER_MEGA_USER=${SUPPLIER_MEGA_USER:-}
      - SUPPLIER_MEGA_PASSWORD=${SUPPLIER_MEGA_PASSWORD:-}
    command: ["sh", "-c", "pip install -q -r requirements.txt && python fetch_price_list_consumer.py"]
    volumes:
      - ./python-api:/app
    depends_on:
      dottpc-rabbit:
        condition: service_healthy
    networks:
      - rabbitnetwork

networks:
  rabbitnetwork:
    driver: bridge

volumes:
  mysql_data:
  back_node_modules: