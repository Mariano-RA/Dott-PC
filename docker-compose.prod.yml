# =============================================================================
# Dott-PC - Producción (Portainer)
# =============================================================================
# Uso: copiar y pegar este archivo en Portainer (Stack > Compose) y luego
# importar las variables de entorno (Stack > Environment variables).
#
# Imágenes Docker Hub: marianora/dott-back:latest y marianora/dott-python:latest
# (override con DOCKERHUB_BACKEND_IMAGE y DOCKERHUB_PYTHON_IMAGE si usás otro tag)
#
# RabbitMQ: RABBITMQ_URL y RABBIT_MQ_URI deben usar el HOST del servicio dentro
# de la red Docker (p. ej. dottpc-rabbit), no localhost. Por defecto se usa
# amqp://guest:guest@dottpc-rabbit:5672/
# =============================================================================

services:
  caddy:
    image: caddy:2
    container_name: dottpc-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Generamos el Caddyfile dentro del contenedor para evitar bind-mount del host.
    # El hostname se define vía variable de entorno (CADDY_HOST) para no hardcodear.
    command: >
      sh -c "echo \"$$CADDY_HOST {\" > /etc/caddy/Caddyfile
      && echo \"  reverse_proxy backend:3000\" >> /etc/caddy/Caddyfile
      && echo \"}\" >> /etc/caddy/Caddyfile
      && caddy run --config /etc/caddy/Caddyfile"
    environment:
      CADDY_HOST: ${CADDY_HOST:-vps-3587040-x.dattaweb.com}
    volumes:
      - dottpc_caddy_data:/data
      - dottpc_caddy_config:/config
    depends_on:
      - backend
    networks:
      - dottpc_net

  mysql:
    image: mysql:8.0
    container_name: dottpc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    volumes:
      - dottpc_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dottpc_net

  dottpc-rabbit:
    container_name: dottpc-rabbit
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "${RABBIT_PORT_AMQP:-5672}:5672"
      - "${RABBIT_PORT_MGMT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dottpc_net

  minio:
    image: minio/minio:latest
    container_name: dottpc-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT_API:-9000}:9000"
      - "${MINIO_PORT_CONSOLE:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - dottpc_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dottpc_net

  backend:
    image: ${DOCKERHUB_BACKEND_IMAGE:-marianora/dott-back:8c38574}
    container_name: dottpc-back
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      ISSUER_BASE_URL: ${ISSUER_BASE_URL}
      AUDIENCE: ${AUDIENCE}
      CLIENT_ORIGIN_URL: ${CLIENT_ORIGIN_URL}
      ENABLE_HTTPS: ${ENABLE_HTTPS:-false}
      JWT_AT_SECRET: ${JWT_AT_SECRET}
      JWT_RT_SECRET: ${JWT_RT_SECRET}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SYNC: ${DB_SYNC:-false}
      RABBIT_MQ_URI: ${RABBIT_MQ_URI:-amqp://guest:guest@dottpc-rabbit:5672/}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      RABBITMQ_PYTHON_QUEUE: ${RABBITMQ_PYTHON_QUEUE}
      RABBITMQ_FETCH_PRICES_QUEUE: ${RABBITMQ_FETCH_PRICES_QUEUE:-fetch_prices}
      LOCAL_DEV_AUTH_BYPASS: ${LOCAL_DEV_AUTH_BYPASS:-}
      CATEGORIES_DATA_PATH: /app/categories_data
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-product-images}
    depends_on:
      dottpc-rabbit:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    # categories_data viene de la imagen (diccionarios.json). Para override: montá
    # tu carpeta, ej.: - ./python-api/data/categories:/app/categories_data
    # volumes:
    #   - dottpc_categories_data:/app/categories_data
    networks:
      - dottpc_net

  python-api:
    image: ${DOCKERHUB_PYTHON_IMAGE:-marianora/dott-python:latest}
    container_name: dottpc-python
    restart: unless-stopped
    ports:
      - "${PYTHON_API_PORT:-5000}:5000"
    environment:
      # Host = nombre del servicio Rabbit en la red (dottpc-rabbit). No usar localhost.
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@dottpc-rabbit:5672/}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      RABBITMQ_PYTHON_QUEUE: ${RABBITMQ_PYTHON_QUEUE}
      RABBITMQ_RETRY_DELAY: ${RABBITMQ_RETRY_DELAY:-5}
      SUPPLIER_AIR_URL: ${SUPPLIER_AIR_URL:-}
      SUPPLIER_AIR_USER: ${SUPPLIER_AIR_USER:-}
      SUPPLIER_AIR_PASSWORD: ${SUPPLIER_AIR_PASSWORD:-}
      SUPPLIER_ELIT_URL: ${SUPPLIER_ELIT_URL:-}
      SUPPLIER_ELIT_USER_ID: ${SUPPLIER_ELIT_USER_ID:-}
      SUPPLIER_ELIT_TOKEN: ${SUPPLIER_ELIT_TOKEN:-}
      SUPPLIER_INVID_URL: ${SUPPLIER_INVID_URL:-}
      SUPPLIER_INVID_USER: ${SUPPLIER_INVID_USER:-}
      SUPPLIER_INVID_PASSWORD: ${SUPPLIER_INVID_PASSWORD:-}
      SUPPLIER_NB_URL: ${SUPPLIER_NB_URL:-}
      SUPPLIER_NB_API_KEY: ${SUPPLIER_NB_API_KEY:-}
      SUPPLIER_NB_TOKEN: ${SUPPLIER_NB_TOKEN:-}
      SUPPLIER_MEGA_URL: ${SUPPLIER_MEGA_URL:-}
      SUPPLIER_MEGA_USER: ${SUPPLIER_MEGA_USER:-}
      SUPPLIER_MEGA_PASSWORD: ${SUPPLIER_MEGA_PASSWORD:-}
    command: ["python", "dottDB.py"]
    depends_on:
      dottpc-rabbit:
        condition: service_healthy
    networks:
      - dottpc_net

  python-api-fetch:
    image: ${DOCKERHUB_PYTHON_IMAGE:-marianora/dott-python:latest}
    container_name: dottpc-python-fetch
    restart: unless-stopped
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@dottpc-rabbit:5672/}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      RABBITMQ_PYTHON_QUEUE: ${RABBITMQ_PYTHON_QUEUE}
      RABBITMQ_FETCH_PRICES_QUEUE: ${RABBITMQ_FETCH_PRICES_QUEUE:-fetch_prices}
      RABBITMQ_RETRY_DELAY: ${RABBITMQ_RETRY_DELAY:-5}
      SUPPLIER_AIR_URL: ${SUPPLIER_AIR_URL:-}
      SUPPLIER_AIR_USER: ${SUPPLIER_AIR_USER:-}
      SUPPLIER_AIR_PASSWORD: ${SUPPLIER_AIR_PASSWORD:-}
      SUPPLIER_ELIT_URL: ${SUPPLIER_ELIT_URL:-}
      SUPPLIER_ELIT_USER_ID: ${SUPPLIER_ELIT_USER_ID:-}
      SUPPLIER_ELIT_TOKEN: ${SUPPLIER_ELIT_TOKEN:-}
      SUPPLIER_INVID_URL: ${SUPPLIER_INVID_URL:-}
      SUPPLIER_INVID_USER: ${SUPPLIER_INVID_USER:-}
      SUPPLIER_INVID_PASSWORD: ${SUPPLIER_INVID_PASSWORD:-}
      SUPPLIER_NB_URL: ${SUPPLIER_NB_URL:-}
      SUPPLIER_NB_API_KEY: ${SUPPLIER_NB_API_KEY:-}
      SUPPLIER_NB_TOKEN: ${SUPPLIER_NB_TOKEN:-}
      SUPPLIER_MEGA_URL: ${SUPPLIER_MEGA_URL:-}
      SUPPLIER_MEGA_USER: ${SUPPLIER_MEGA_USER:-}
      SUPPLIER_MEGA_PASSWORD: ${SUPPLIER_MEGA_PASSWORD:-}
    command: ["python", "fetch_price_list_consumer.py"]
    depends_on:
      dottpc-rabbit:
        condition: service_healthy
    networks:
      - dottpc_net

networks:
  dottpc_net:
    driver: bridge

volumes:
  dottpc_mysql_data:
  dottpc_caddy_data:
  dottpc_caddy_config:
  dottpc_minio_data:
  # dottpc_categories_data:  # opcional si querés persistir/override categories_data
