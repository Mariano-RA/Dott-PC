services:
  dottpc-rabbit:
    container_name: dottpc-rabbit
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - rabbitnetwork

  mysql:
    image: mysql:8.0
    container_name: mysql-database
    ports:
      - "3306:3306"
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rabbitnetwork

  backend:
    # build:
    #   dockerfile: ./Dockerfile
    #   context: ./back
    image: marianora/dott-back:3.3
    container_name: dott-back
    ports:
      - "3000:3000"
    environment:
      - RABBIT_MQ_URI=amqp://dottpc-rabbit:5672
    depends_on:
      - dottpc-rabbit
    networks:
      - rabbitnetwork

  python-api:
    # build:
    #   dockerfile: ./Dockerfile
    #   context: ./python-api
    image: marianora/dott-python:2.4
    container_name: dott-python
    ports:
      - "5000:5000"
    environment:
      - RABBITMQ_URL=dottpc-rabbit
    depends_on:
      - dottpc-rabbit
    networks:
      - rabbitnetwork

networks:
  rabbitnetwork:
    driver: bridge

volumes:
  mysql_data: